{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Demote Student: {{ student.name }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Current Details Info Box -->
                        <div class="alert alert-warning mb-3">
                            <p class="mb-1"><strong>Current Class:</strong> {{ student.current_class }}</p>
                            <p class="mb-0"><strong>Current Session:</strong> {{ student.session }}</p>
                        </div>

                        <!-- Target Class Selection -->
                        <div class="mb-3">
                            <label for="to_class" class="form-label">Demote To Class <span class="text-danger">*</span></label>
                            <select name="to_class" id="to_class" class="form-select" required>
                                <option value="">-- Select Class --</option>
                                {% for cls in classes %}
                                    <option value="{{ cls.id }}">{{ cls.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Target Session Selection -->
                        <div class="mb-3">
                            <label for="to_session" class="form-label">Target Academic Session</label>
                            <select name="to_session" id="to_session" class="form-select">
                                <option value="">-- Select Session --</option>
                                {% for sess in sessions %}
                                    <option value="{{ sess.id }}">{{ sess.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'student_fee_dashboard' student.id %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Confirm Demotion</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
